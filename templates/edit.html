<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction - Smart Expense Tracker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .header {
            background: #1f4d36;
            color: white;
            padding: 25px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* Flash Messages */

        .flash {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .flash.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .flash.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1f4d36;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .back-button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        button {
            background: #1f4d36;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .back-button {
            background: #e5e7eb;
            color: #333;
        }

        .back-button:hover {
            background: #d1d5db;
        }

        @media (max-width: 600px) {

            .container {
                width: 95%;
                margin: 20px auto;
            }

            .card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>✏️ Edit Transaction</h1>

    </div>


    <div class="card">


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}



        <form
            method="POST"
            action="{{ url_for('edit_transaction', id=transaction.id) }}"
        >


            <!-- Transaction Type -->

            <div class="form-group">

                <label for="transaction_type">
                    Transaction Type
                </label>

                <select
                    name="transaction_type"
                    id="transaction_type"
                    required
                >

                    <option
                        value="expense"
                        {% if transaction.transaction_type == "expense" %}
                        selected
                        {% endif %}
                    >
                        Expense
                    </option>

                    <option
                        value="income"
                        {% if transaction.transaction_type == "income" %}
                        selected
                        {% endif %}
                    >
                        Income
                    </option>

                </select>

            </div>



            <!-- Amount -->

            <div class="form-group">

                <label for="amount">
                    Amount (₹)
                </label>

                <input
                    type="number"
                    name="amount"
                    id="amount"
                    step="0.01"
                    value="{{ transaction.amount }}"
                    required
                >

            </div>



            <!-- Category -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    name="category"
                    id="category"
                    value="{{ transaction.category }}"
                    required
                >

            </div>



            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <input
                    type="text"
                    name="description"
                    id="description"
                    value="{{ transaction.description or '' }}"
                    placeholder="Enter description"
                >

            </div>



            <!-- Transaction Date -->

            <div class="form-group">

                <label for="date">
                    Transaction Date
                </label>

                <input
                    type="date"
                    name="date"
                    id="date"
                    value="{{ transaction.date.strftime('%Y-%m-%d') if transaction.date else '' }}"
                    required
                >

            </div>



            <!-- Buttons -->

            <div class="buttons">

                <button type="submit">
                    💾 Save Changes
                </button>

                <a
                    href="{{ url_for('index') }}"
                    class="back-button"
                >
                    ← Back
                </a>

            </div>


        </form>


    </div>


</div>


</body>

</html>
